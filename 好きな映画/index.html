<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>私のおすすめ映画コレクション</title>
    <!-- Google Fonts の読み込み -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@400;700&display=swap" rel="stylesheet">
    
    <style>
        /* CSSスタイル設計 */
        :root {
            --bg-color: #0f172a;
            --card-bg: #1e293b;
            --text-color: #f8fafc;
            --text-muted: #94a3b8;
            --accent-color: #e11d48;
            --accent-hover: #be123c;
            --star-color: #fbbf24;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: 'Noto Sans JP', sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            line-height: 1.6;
            padding-bottom: 50px;
        }

        /* ヘッダー */
        header {
            background: linear-gradient(135deg, #1e1b4b 0%, #0f172a 100%);
            text-align: center;
            padding: 3rem 1rem;
            border-bottom: 2px solid #334155;
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.4);
        }

        header h1 {
            font-size: 2.5rem;
            margin-bottom: 0.5rem;
            color: #fff;
            letter-spacing: 2px;
        }

        header p {
            color: var(--text-muted);
            font-size: 1rem;
        }

        /* コンテナとカードグリッド */
        .container {
            max-width: 1100px;
            margin: 2rem auto;
            padding: 0 1.5rem;
        }

        .movie-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(300px, 1fr));
            gap: 2rem;
        }

        /* 映画カード */
        .movie-card {
            background-color: var(--card-bg);
            border-radius: 12px;
            overflow: hidden;
            box-shadow: 0 10px 15px -3px rgba(0, 0, 0, 0.3);
            transition: transform 0.3s ease, box-shadow 0.3s ease;
            display: flex;
            flex-direction: column;
        }

        .movie-card:hover {
            transform: translateY(-8px);
            box-shadow: 0 20px 25px -5px rgba(0, 0, 0, 0.5);
        }

        .movie-poster {
            width: 100%;
            height: 380px;
            object-fit: cover;
            background-color: #334155;
        }

        .movie-info {
            padding: 1.5rem;
            display: flex;
            flex-direction: column;
            flex-grow: 1;
        }

        .movie-title {
            font-size: 1.4rem;
            font-weight: 700;
            margin-bottom: 0.5rem;
        }

        .movie-meta {
            display: flex;
            align-items: center;
            gap: 10px;
            font-size: 0.85rem;
            color: var(--text-muted);
            margin-bottom: 0.75rem;
        }

        .rating {
            color: var(--star-color);
            font-weight: bold;
        }

        .genre-tag {
            background-color: #334155;
            color: #e2e8f0;
            padding: 2px 8px;
            border-radius: 4px;
            font-size: 0.75rem;
        }

        .movie-description {
            font-size: 0.95rem;
            color: #cbd5e1;
            margin-bottom: 1.5rem;
            flex-grow: 1;
        }

        /* アクションボタン（予告編を見る等） */
        .btn {
            display: inline-block;
            width: 100%;
            padding: 0.75rem;
            text-align: center;
            background-color: var(--accent-color);
            color: white;
            text-decoration: none;
            border-radius: 6px;
            font-weight: bold;
            transition: background-color 0.2s ease;
        }

        .btn:hover {
            background-color: var(--accent-hover);
        }

        /* フッター */
        footer {
            text-align: center;
            padding: 2rem;
            color: var(--text-muted);
            font-size: 0.85rem;
            margin-top: 3rem;
            border-top: 1px solid #334155;
        }
    </style>
</head>
<body>

    <header>
        <h1>🎬 MY FAVORITE MOVIES</h1>
        <p>心に残るおすすめの映画作品を紹介します</p>
    </header>

    <main class="container">
        <div class="movie-grid" id="movieGrid">
            <!-- JavaScriptで動的にカードが挿入されます -->
        </div>
    </main>

    <footer>
        <p>&copy; 2026 My Movie Gallery. All rights reserved.</p>
    </footer>

    <script>
        // 映画データの定義（ここを自分の好きな映画に変更してください）
        const movies = [
            {
                title: "インセプション",
                year: 2010,
                genre: "SF / アクション",
                rating: "★ 4.8",
                image: "https://images.unsplash.com/photo-1536440136628-849c177e76a1?auto=format&fit=crop&w=600&q=80",
                description: "他人の夢の中に潜入してアイデアを植え付ける、犯罪プロフェッショナルの戦いを描いた圧巻のSFアクションサスペンス。",
                trailerLink: "https://www.youtube.com/"
            },
            {
                title: "ラ・ラ・ランド",
                year: 2016,
                genre: "ミュージカル / 恋愛",
                rating: "★ 4.6",
                image: "https://images.unsplash.com/photo-1517604931442-7e0c8ed2963c?auto=format&fit=crop&w=600&q=80",
                description: "夢を追う人々が集まる街ロサンゼルスで、女優を目指すミアとジャズピアニストのセバスチャンの切なくも美しい恋を描いたミュージカル。",
                trailerLink: "https://www.youtube.com/"
            },
            {
                title: "ショーシャンクの空に",
                year: 1994,
                genre: "ドラマ",
                rating: "★ 4.9",
                image: "https://images.unsplash.com/photo-1489599849927-2ee91cede3ba?auto=format&fit=crop&w=600&q=80",
                description: "冤罪で刑務所に収監された銀行員が、絶望的な状況でも希望を捨てずに強く生き抜く姿を描いた不朽の名作ドラマ。",
                trailerLink: "https://www.youtube.com/"
            }
        ];

        // 画面に映画カードを出力する処理
        const movieGrid = document.getElementById('movieGrid');

        movies.forEach(movie => {
            const card = document.createElement('div');
            card.className = 'movie-card';

            card.innerHTML = `
                <img src="${movie.image}" alt="${movie.title}" class="movie-poster">
                <div class="movie-info">
                    <h2 class="movie-title">${movie.title}</h2>
                    <div class="movie-meta">
                        <span>${movie.year}年</span>
                        <span class="genre-tag">${movie.genre}</span>
                        <span class="rating">${movie.rating}</span>
                    </div>
                    <p class="movie-description">${movie.description}</p>
                    <a href="${movie.trailerLink}" target="_blank" rel="noopener noreferrer" class="btn">予告編を見る</a>
                </div>
            `;

            movieGrid.appendChild(card);
        });
    </script>
</body>
</html>
